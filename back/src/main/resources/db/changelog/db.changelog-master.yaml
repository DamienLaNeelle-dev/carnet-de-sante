databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: damien
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_email
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - sql:
            sql: ALTER TABLE users ADD CONSTRAINT chk_users_role CHECK (role IN ('PATIENT', 'ADMIN'))
        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_users_role
            tableName: users
            columns:
              - column:
                  name: role
      rollback:
        - dropTable:
            tableName: users

  # ===================================================
  # V2 : Table PATIENTS (Profils patients)
  # ===================================================
  - changeSet:
      id: 2-create-patients-table
      author: damien
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_patients
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_patients_user_id
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: date_naissance
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: numero_secu
                  type: VARCHAR(15)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_patients_numero_secu
              - column:
                  name: groupe_sanguin
                  type: VARCHAR(10)
              - column:
                  name: contact_urgence
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_patient_user
            baseTableName: patients
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE patients ADD CONSTRAINT chk_date_naissance_passee CHECK (date_naissance <= CURRENT_DATE)
        - sql:
            sql: ALTER TABLE patients ADD CONSTRAINT chk_date_naissance_realiste CHECK (date_naissance >= CURRENT_DATE - INTERVAL '150 years')
        - sql:
            sql: ALTER TABLE patients ADD CONSTRAINT chk_groupe_sanguin_valide CHECK (groupe_sanguin IS NULL OR groupe_sanguin IN ('A_POSITIF', 'A_NEGATIF', 'B_POSITIF', 'B_NEGATIF', 'AB_POSITIF', 'AB_NEGATIF', 'O_POSITIF', 'O_NEGATIF'))
        - createIndex:
            indexName: idx_patients_user_id
            tableName: patients
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_patients_date_naissance
            tableName: patients
            columns:
              - column:
                  name: date_naissance
        - createIndex:
            indexName: idx_patients_numero_secu
            tableName: patients
            columns:
              - column:
                  name: numero_secu
      rollback:
        - dropTable:
            tableName: patients