<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Carnet de santé</title>
</head>
<body class="overflow-y-hidden">
<div class="total-center">
    <div class="form-container">
        <div class="form-header">
            <h1>Créer mon compte</h1>
            <p>Gérez votre santé en ligne</p>
        </div>

        <form class="form" id="registerForm">
            <div class="form-group">
                <label for="email">Email *</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="votre.email@exemple.com"
                        required
                >
            </div>

            <div class="form-group">
                <label for="password">Mot de passe *</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 caractères"
                        minlength="8"
                        required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="nom">Nom *</label>
                    <input
                            type="text"
                            id="nom"
                            name="nom"
                            placeholder="Dupont"
                            required
                    >
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom *</label>
                    <input
                            type="text"
                            id="prenom"
                            name="prenom"
                            placeholder="Jean"
                            required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="dateNaissance">Date de naissance *</label>
                <input
                        type="date"
                        id="dateNaissance"
                        name="dateNaissance"
                        required
                >
            </div>

            <div class="form-group">
                <label for="numeroSecu">Numéro de sécurité sociale *</label>
                <input
                        type="text"
                        id="numeroSecu"
                        name="numeroSecu"
                        placeholder="123456789012345"
                        pattern="[0-9]{15}"
                        title="15 chiffres requis"
                        required
                >
            </div>

            <div class="form-group">
                <label for="groupeSanguin">Groupe sanguin</label>
                <select id="groupeSanguin" name="groupeSanguin">
                    <option value="">Sélectionner (optionnel)</option>
                    <option value="A_POSITIF">A+</option>
                    <option value="A_NEGATIF">A-</option>
                    <option value="B_POSITIF">B+</option>
                    <option value="B_NEGATIF">B-</option>
                    <option value="AB_POSITIF">AB+</option>
                    <option value="AB_NEGATIF">AB-</option>
                    <option value="O_POSITIF">O+</option>
                    <option value="O_NEGATIF">O-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="contactUrgence">Contact d'urgence</label>
                <input
                        type="text"
                        id="contactUrgence"
                        name="contactUrgence"
                        placeholder="Nom et téléphone"
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Créer mon compte</button>
            </div>
        </form>

        <div class="form-footer">
            <p>Déjà un compte ? <a href="/login">Se connecter</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/api/auth/register/patient', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('✅ Compte créé avec succès ! Vous pouvez maintenant vous connecter.');
                window.location.href = '/login';
            } else if (response.status === 409) {
                alert('❌ Cet email ou numéro de sécurité sociale est déjà utilisé.');
            } else {
                alert('❌ Erreur lors de la création du compte. Vérifiez vos informations.');
            }
        } catch (error) {
            console.error('Erreur:', error);
            alert('❌ Erreur de connexion au serveur.');
        }
    });
</script>
</body>
</html>
