databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: damien
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_email
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - sql:
            sql: ALTER TABLE users ADD CONSTRAINT chk_users_role CHECK (role IN ('PATIENT', 'MEDECIN', 'ADMIN'))
        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_users_role
            tableName: users
            columns:
              - column:
                  name: role
      rollback:
        - dropTable:
            tableName: users

  # ===================================================
  # V2 : Table PATIENTS (Profils patients)
  # ===================================================
  - changeSet:
      id: 2-create-patients-table
      author: damien
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_patients
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_patients_user_id
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: date_naissance
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: numero_secu
                  type: VARCHAR(15)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_patients_numero_secu
              - column:
                  name: groupe_sanguin
                  type: VARCHAR(10)
              - column:
                  name: contact_urgence
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_patient_user
            baseTableName: patients
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE patients ADD CONSTRAINT chk_date_naissance_passee CHECK (date_naissance <= CURRENT_DATE)
        - sql:
            sql: ALTER TABLE patients ADD CONSTRAINT chk_date_naissance_realiste CHECK (date_naissance >= CURRENT_DATE - INTERVAL '150 years')
        - sql:
            sql: ALTER TABLE patients ADD CONSTRAINT chk_groupe_sanguin_valide CHECK (groupe_sanguin IS NULL OR groupe_sanguin IN ('A_POSITIF', 'A_NEGATIF', 'B_POSITIF', 'B_NEGATIF', 'AB_POSITIF', 'AB_NEGATIF', 'O_POSITIF', 'O_NEGATIF'))
        - createIndex:
            indexName: idx_patients_user_id
            tableName: patients
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_patients_date_naissance
            tableName: patients
            columns:
              - column:
                  name: date_naissance
        - createIndex:
            indexName: idx_patients_numero_secu
            tableName: patients
            columns:
              - column:
                  name: numero_secu
      rollback:
        - dropTable:
            tableName: patients

  # ===================================================
  # V3 : Table MEDECINS (Professionnels de santé)
  # ===================================================
  - changeSet:
      id: 3-create-medecins-table
      author: damien
      changes:
        - createTable:
            tableName: medecins
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_medecins
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_medecins_user_id
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: numero_rpps
                  type: VARCHAR(11)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_medecins_numero_rpps
              - column:
                  name: specialite
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: etablissement
                  type: VARCHAR(255)
              - column:
                  name: valide
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_medecin_user
            baseTableName: medecins
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE medecins ADD CONSTRAINT chk_medecin_specialite CHECK (specialite IN ('GENERALISTE', 'CARDIOLOGUE', 'DERMATOLOGUE', 'PEDIATRE', 'GYNECO', 'OPHTALMOLOGUE', 'ORL', 'PSYCHIATRE', 'RADIOLOGUE', 'CHIRURGIEN'))
        - createIndex:
            indexName: idx_medecins_user_id
            tableName: medecins
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_medecins_numero_rpps
            tableName: medecins
            columns:
              - column:
                  name: numero_rpps
        - createIndex:
            indexName: idx_medecins_specialite
            tableName: medecins
            columns:
              - column:
                  name: specialite
        - createIndex:
            indexName: idx_medecins_valide
            tableName: medecins
            columns:
              - column:
                  name: valide
      rollback:
        - dropTable:
            tableName: medecins

  # ===================================================
  # V4 : Tables CONSULTATIONS & ORDONNANCES
  # ===================================================
  - changeSet:
      id: 4-create-consultations-table
      author: damien
      changes:
        - createTable:
            tableName: consultations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_consultations
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: medecin_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: date_consultation
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: motif
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: anamnese
                  type: TEXT
              - column:
                  name: examen_clinique
                  type: TEXT
              - column:
                  name: diagnostic
                  type: TEXT
              - column:
                  name: conduite_a_tenir
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_consultation_patient
            baseTableName: consultations
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_consultation_medecin
            baseTableName: consultations
            baseColumnNames: medecin_id
            referencedTableName: medecins
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_consultations_patient
            tableName: consultations
            columns:
              - column:
                  name: patient_id
        - createIndex:
            indexName: idx_consultations_medecin
            tableName: consultations
            columns:
              - column:
                  name: medecin_id
        - createIndex:
            indexName: idx_consultations_date
            tableName: consultations
            columns:
              - column:
                  name: date_consultation
      rollback:
        - dropTable:
            tableName: consultations

  - changeSet:
      id: 4-create-ordonnances-table
      author: damien
      changes:
        - createTable:
            tableName: ordonnances
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ordonnances
              - column:
                  name: consultation_id
                  type: BIGINT
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: medecin_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: date_ordonnance
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: date_fin_validite
                  type: DATE
              - column:
                  name: statut
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_ordonnance_consultation
            baseTableName: ordonnances
            baseColumnNames: consultation_id
            referencedTableName: consultations
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            constraintName: fk_ordonnance_patient
            baseTableName: ordonnances
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_ordonnance_medecin
            baseTableName: ordonnances
            baseColumnNames: medecin_id
            referencedTableName: medecins
            referencedColumnNames: id
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE ordonnances ADD CONSTRAINT chk_ordonnance_statut CHECK (statut IN ('ACTIVE', 'ARCHIVEE', 'ANNULEE'))
        - createIndex:
            indexName: idx_ordonnances_patient
            tableName: ordonnances
            columns:
              - column:
                  name: patient_id
        - createIndex:
            indexName: idx_ordonnances_medecin
            tableName: ordonnances
            columns:
              - column:
                  name: medecin_id
      rollback:
        - dropTable:
            tableName: ordonnances

  - changeSet:
      id: 4-create-ordonnance-medicaments-table
      author: damien
      changes:
        - createTable:
            tableName: ordonnance_medicaments
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ordonnance_medicaments
              - column:
                  name: ordonnance_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: nom_medicament
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: dosage
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: frequence
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: duree_traitement
                  type: VARCHAR(100)
              - column:
                  name: instructions
                  type: TEXT
        - addForeignKeyConstraint:
            constraintName: fk_medicament_ordonnance
            baseTableName: ordonnance_medicaments
            baseColumnNames: ordonnance_id
            referencedTableName: ordonnances
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_medicaments_ordonnance
            tableName: ordonnance_medicaments
            columns:
              - column:
                  name: ordonnance_id
      rollback:
        - dropTable:
            tableName: ordonnance_medicaments

  # ===================================================
  # V5 : Table RENDEZ-VOUS
  # ===================================================
  - changeSet:
      id: 5-create-rendez-vous-table
      author: damien
      changes:
        - createTable:
            tableName: rendez_vous
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rendez_vous
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: medecin_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: date_rdv
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: duree_minutes
                  type: INTEGER
                  defaultValueNumeric: 30
                  constraints:
                    nullable: false
              - column:
                  name: motif
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: statut
                  type: VARCHAR(20)
                  defaultValue: PLANIFIE
                  constraints:
                    nullable: false
              - column:
                  name: lieu
                  type: VARCHAR(255)
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: rappel_envoye
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_rdv_patient
            baseTableName: rendez_vous
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_rdv_medecin
            baseTableName: rendez_vous
            baseColumnNames: medecin_id
            referencedTableName: medecins
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE rendez_vous ADD CONSTRAINT chk_rdv_statut CHECK (statut IN ('PLANIFIE', 'CONFIRME', 'ANNULE', 'TERMINE', 'ABSENT'))
        - createIndex:
            indexName: idx_rdv_patient
            tableName: rendez_vous
            columns:
              - column:
                  name: patient_id
        - createIndex:
            indexName: idx_rdv_medecin
            tableName: rendez_vous
            columns:
              - column:
                  name: medecin_id
        - createIndex:
            indexName: idx_rdv_date
            tableName: rendez_vous
            columns:
              - column:
                  name: date_rdv
        - createIndex:
            indexName: idx_rdv_statut
            tableName: rendez_vous
            columns:
              - column:
                  name: statut
      rollback:
        - dropTable:
            tableName: rendez_vous

  # ===================================================
  # V6 : Système de PARTAGE et LOGS (RGPD)
  # ===================================================
  - changeSet:
      id: 6-create-partage-dossiers-table
      author: damien
      changes:
        - createTable:
            tableName: partage_dossiers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_partage_dossiers
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: medecin_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: niveau_acces
                  type: VARCHAR(20)
                  defaultValue: LECTURE
                  constraints:
                    nullable: false
              - column:
                  name: date_debut
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_fin
                  type: TIMESTAMP
              - column:
                  name: actif
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_partage_patient
            baseTableName: partage_dossiers
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_partage_medecin
            baseTableName: partage_dossiers
            baseColumnNames: medecin_id
            referencedTableName: medecins
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE partage_dossiers ADD CONSTRAINT chk_partage_niveau_acces CHECK (niveau_acces IN ('LECTURE', 'ECRITURE'))
        - createIndex:
            indexName: idx_partage_patient_medecin
            tableName: partage_dossiers
            columns:
              - column:
                  name: patient_id
              - column:
                  name: medecin_id
        - createIndex:
            indexName: idx_partage_actif
            tableName: partage_dossiers
            columns:
              - column:
                  name: actif
      rollback:
        - dropTable:
            tableName: partage_dossiers

  - changeSet:
      id: 6-create-logs-acces-dossier-table
      author: damien
      changes:
        - createTable:
            tableName: logs_acces_dossier
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_logs_acces_dossier
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: utilisateur_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type_utilisateur
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: ressource
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: TEXT
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_log_patient
            baseTableName: logs_acces_dossier
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_log_utilisateur
            baseTableName: logs_acces_dossier
            baseColumnNames: utilisateur_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
        - sql:
            sql: ALTER TABLE logs_acces_dossier ADD CONSTRAINT chk_log_type_utilisateur CHECK (type_utilisateur IN ('PATIENT', 'MEDECIN', 'ADMIN'))
        - createIndex:
            indexName: idx_logs_patient
            tableName: logs_acces_dossier
            columns:
              - column:
                  name: patient_id
        - createIndex:
            indexName: idx_logs_utilisateur
            tableName: logs_acces_dossier
            columns:
              - column:
                  name: utilisateur_id
        - createIndex:
            indexName: idx_logs_timestamp
            tableName: logs_acces_dossier
            columns:
              - column:
                  name: timestamp
      rollback:
        - dropTable:
            tableName: logs_acces_dossier